apiVersion: apps/v1
kind: Deployment
metadata:
  name: email
  labels:
    app: email
spec:
  replicas: 2
  selector:
    matchLabels:
      app: email
  template:
    metadata:
      labels:
        app: email
    spec:
      containers:
        - name: email
          image: wesleymime/email
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 500Mi
          env:
            - name: server.port
              value: "8080"
            - name: spring.profiles.active
              value: "prod"
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: prod-secrets
                  key: email-user
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prod-secrets
                  key: email-password
            - name: kafka.bootstrapAddress
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: kafka-url
            - name: eureka.client.serviceUrl.defaultZone
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: eureka-url
            - name: spring.boot.admin.client.url
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: bootadmin-url
            - name: spring.boot.admin.client.instance.service-url
              value: http://email-service:8080
---
apiVersion: v1
kind: Service
metadata:
  name: email-service
spec:
  selector:
    app: email
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080