apiVersion: apps/v1
kind: Deployment
metadata:
  name: email
  labels:
    app: email
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email
  template:
    metadata:
      labels:
        app: email
    spec:
      containers:
        - name: email
          image: wesleymime/email
          env:
            - name: server.port
              value: "8080"
            - name: spring.profiles.active
              value: "dev"
            - name: kafka.bootstrapAddress
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: kafka-url
            - name: eureka.client.serviceUrl.defaultZone
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: eureka-url
            - name: spring.boot.admin.client.url
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: bootadmin-url
            - name: spring.boot.admin.client.instance.service-url
              value: http://email-service:8080
---
apiVersion: v1
kind: Service
metadata:
  name: email-service
spec:
  type: LoadBalancer
  selector:
    app: email
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080