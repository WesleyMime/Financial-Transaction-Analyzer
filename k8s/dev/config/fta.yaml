apiVersion: apps/v1
kind: Deployment
metadata:
  name: fta
  labels:
    app: fta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fta
  template:
    metadata:
      labels:
        app: fta
    spec:
      containers:
        - name: fta
          image: wesleymime/fta
          ports:
            - containerPort: 80
          env:
            - name: spring.profiles.active
              value: "prod"
            - name: spring.data.mongodb.host
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: mongodb-url
            - name: spring.data.mongodb.username
              valueFrom:
                secretKeyRef:
                  name: dev-secrets
                  key: mongodb-user
            - name: spring.data.mongodb.password
              valueFrom:
                secretKeyRef:
                  name: dev-secrets
                  key: mongodb-password
            - name: kafka.bootstrapAddress
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: kafka-url
            - name: eureka.client.serviceUrl.defaultZone
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: eureka-url
            - name: spring.boot.admin.client.url
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: bootadmin-url
            - name: spring.boot.admin.client.instance.service-url
              value: http://fta-service:80
---
apiVersion: v1
kind: Service
metadata:
  name: fta-service
spec:
  type: LoadBalancer
  selector:
    app: fta
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  externalIPs:
    - 192.168.49.2